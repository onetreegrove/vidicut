[unix_http_server]
file=/tmp/supervisor_douyin.sock

[supervisord]
logfile=/Users/justonetree/wwwroot/vidicut/downloads/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisor_douyin.pid
nodaemon=false
silent=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor_douyin.sock

[program:douyin_downloader_daemon]
command=bun run supervisord/dy_monitor_daemon.ts
directory=/Users/justonetree/wwwroot/vidicut
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/Users/justonetree/wwwroot/vidicut/downloads/daemon_stdout.log
stderr_logfile=/Users/justonetree/wwwroot/vidicut/downloads/daemon_stderr.log
environment=PATH="/Users/justonetree/.local/state/fnm_multishells/960_1786705714526/bin:/usr/local/bin:/usr/bin:/bin"

[program:web_api_server]
command=bun run server/index.ts
directory=/Users/justonetree/wwwroot/vidicut
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/Users/justonetree/wwwroot/vidicut/downloads/web_api_stdout.log
stderr_logfile=/Users/justonetree/wwwroot/vidicut/downloads/web_api_stderr.log
environment=PATH="/Users/justonetree/.local/state/fnm_multishells/960_1786705714526/bin:/usr/local/bin:/usr/bin:/bin"
